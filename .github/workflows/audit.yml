name: Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '11 3 * * *'
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  go:
    uses: typisttech/.github/.github/workflows/audit-go.yml@ba4e7de660323116418d8f16ee100399c51773e9 # v9.0.0
